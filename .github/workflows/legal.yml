name: legal checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv venv --python 3.12
      - run: uv pip sync --require-hashes requirements-dev.txt
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: .venv/bin/cfn-lint infra/receipts/template.yaml
      - run: .venv/bin/python scripts/legal.py build
      - run: .venv/bin/python scripts/legal.py check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legal-preview
          path: public/
          retention-days: 7
